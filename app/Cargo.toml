[package]
name = "downlight"
description = "Downlight, a small, fast viewer for Markdown files."
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
downlight-core = { path = "../core" }
# Watching a document's folder for saves (ticket 10).
notify = "8.2.2"
# The open dialog. No default features: they are Linux's portal and Wayland, which the Linux port
# adds back.
rfd = { version = "0.18.0", default-features = false }
serde = "1.0.229"
# The settings file (ticket 15). Already in the tree through Tauri.
serde_json = "1.0.154"
# No default features, for size: drops dynamic-acl and compression. The Linux port adds x11 and
# dbus back.
tauri = { version = "2.12.5", default-features = false, features = ["wry", "common-controls-v6"] }
tauri-plugin-single-instance = "2.5.5"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
# WebView2's own interfaces, for leaving every key to the page (tickets 10 and 29). The versions wry
# uses, so they add nothing to the tree.
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-version = "0.1.7"

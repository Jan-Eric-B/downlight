# cargo-about: the Rust crates' licenses for the third-party notices (ticket 36), which
# scripts/notices.js assembles. The target and the licenses are deny.toml's.

targets = ["x86_64-pc-windows-msvc"]
# In order of preference: for a crate under a choice of licenses, the first one here is the one
# its notice gives. MIT comes first, as its texts are short and carry the authors' copyright.
accepted = [
  "MIT",
  "Apache-2.0",
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
# Only the tests use dev-dependencies, so they never ship.
ignore-dev-dependencies = true

[private]
# The workspace's own crates are unpublished and licensed by LICENSE.
ignore = true

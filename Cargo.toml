[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"

# A small binary: with removeUnusedCommands this took downlight.exe from 9.5 MB to 3.1 MB, and a
# 1 MB document renders in 50 ms instead of 42 ms at opt-level 3. Unwinding stays on, so a panic
# while rendering shows an error instead of closing every window (ADR 0001).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

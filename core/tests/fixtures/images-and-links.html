<p data-sourcepos="3:1-3:68">A local image, <img src="http://image.localhost/C:/lamps/the%20lamp.png" alt="The lamp">, in a paragraph.</p>

<p data-sourcepos="9:1-9:160">Links: <a href="mailto:lamp@example.com">mailto:lamp@example.com</a>, <a href="https://example.com/lamp">the web</a>, <a href="#images-and-links">a heading</a>, <a href="docs/guide.md">another document</a> and <a href="lamp.png">a file</a>.</p>

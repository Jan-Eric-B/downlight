[package]
name = "downlight-core"
description = "Decodes and renders Downlight's documents. No Tauri dependency, so its tests need no window."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ammonia = "4.2.4"
comrak = { version = "0.59.0", default-features = false, features = ["shortcodes"] }
encoding_rs = "0.8.44"
serde = { version = "1.0.229", default-features = false }
url = "2.5.8"

[lints]
workspace = true

[package]
name = "downlight-core"
description = "Decodes and renders Downlight's documents. No Tauri dependency, so its tests need no window."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ammonia = "4.2.4"
comrak = { version = "0.59.0", default-features = false, features = ["shortcodes"] }
encoding_rs = "0.8.44"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["regex-fancy", "parsing"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
